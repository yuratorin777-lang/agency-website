name: Generate SEO Pages via Gemini

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Количество страниц для генерации'
        required: true
        default: '4'

  schedule:
    - cron: '0 0 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv

      - name: Запуск генератора Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_API_URL: ${{ secrets.VERCEL_API_URL }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          python seo/generator/generate_pages.py

      - name: Сборка HTML и Sitemap
        working-directory: ./seo/generator
        run: |
          node build.js

      - name: Коммит изменений
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "feat(seo): генерация страниц и HTML сборка"
            git push
          else
            echo "Нет изменений для коммита."
          fi
