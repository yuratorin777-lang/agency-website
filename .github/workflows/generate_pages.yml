name: Generate SEO Pages via Gemini

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Количество страниц для генерации'
        required: false
        default: '4'

  schedule:
    # Запуск каждый час в 00 минут
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv

      - name: 1. Генерация JSON страниц (Python)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_API_URL: ${{ secrets.VERCEL_API_URL }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '4' }}
        run: |
          python seo/generator/generate_pages.py

      - name: 2. Сборка HTML и Sitemap (Node.js)
        run: |
          node seo/generator/build.js

      - name: 3. Коммит и деплой изменений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git status --porcelain | grep -q .; then
            git commit -m "feat(seo): авто-генерация батча [skip ci]"
            # Подтягиваем свежие изменения с репозитория перед отправкой
            git pull --rebase origin main
            git push origin main
          else
            echo "Нет новых изменений для коммита."
          fi